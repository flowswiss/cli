version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: flow
    main: ./cmd/flow
    binary: flow
    ldflags:
      - '-X main.Version={{.Version}}'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

universal_binaries:
  - id: flow
    replace: false
    name_template: flow

archives:
  - id: flow
    ids:
      - flow
    name_template: >-
      flow-{{ .Version }}-{{ .Os }}-
      {{- if eq .Arch "all" }}universal
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: flowswiss
    name: cli
  draft: true

snapshot:
  version_template: "{{ incpatch .Version }}-dev"
